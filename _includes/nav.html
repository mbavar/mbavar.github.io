<header class="site-header shell">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Mo Bavarian — Home"><span class="monogram" aria-hidden="true">mb<span>.</span></span><span>bavarian.dev</span></a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' or paginator %} aria-current="page"{% endif %}>Home</a>
    {% for link in site.navbar-links %}
      {% assign nav_path = link[1] | prepend: '/' %}
      <a href="{{ nav_path | relative_url }}"{% if page.url contains link[1] %} aria-current="page"{% endif %}>{{ link[0] }}</a>
    {% endfor %}
  </nav>
</header>
